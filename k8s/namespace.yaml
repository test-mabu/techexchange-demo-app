# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    name: ${NAMESPACE}
    app.kubernetes.io/name: ${NAMESPACE}
    app.kubernetes.io/component: observability-demo
    security.policy.io/isolation: demo-environment

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAMESPACE}-sa
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAMESPACE}-reader
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAMESPACE}-reader-binding
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${NAMESPACE}-sa
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: ${NAMESPACE}-reader
  apiGroup: rbac.authorization.k8s.io

---
# Secret for demo credentials
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ${NAMESPACE}
type: Opaque
data:
  database-user: ZGVtb3VzZXI=
  database-password: ZGVtb3Bhc3N3b3Jk
  api-key: ZGVtby1hcGkta2V5LXR1cmJvLWluc3RhbmE=
