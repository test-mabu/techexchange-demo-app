# AntonV3 manifest — echo-service (Spring Boot, Log4j 2.14.1 / CVE-2021-44228 — INTENTIONAL)
#
# Leaf node, no requirements. Deployed by the _generic worker.
# Gives the scanner (SBOM Attach / Concert Secure) guaranteed findings.

metadata:
  name: echo-service

spec:
  id: echo-service-001

  global-properties:
    tennant: {}
    security: {}
    environment: {}

  properties:
    t-shirt:
      source: input
      enum:
        - S
        - M
        - L
        - XL
      default: S           # 250m/512Mi (original: 100m/512Mi req); M = 1 CPU does not schedule on the lab cluster
    redundancy:
      source: input
      enum:
        - none
        - ha
      default: none
    spring-profiles:
      source: input
      default: "production,vulnerable"

  requirements: []

  deployment:
    image:
      family: docker.io/mbx1010/echo-service    # pipeline pushes <DOCKERHUB_USERNAME>/echo-service
      tag: "3.0.0"                              # no 'latest' tag exists on Docker Hub for this image
      version: default
    # NOTE: the published image docker.io/mbx1010/echo-service:3.0.0 is a Jetty build that listens on
    # 8080 and ignores SERVER_PORT (verified 2026-09-10: "started on port 8080", /health only on 8080).
    # Images built from java-app/Dockerfile honour SERVER_PORT=8085 — switch ports back when using those.
    ports:
      - name: http
        port: 8080
    storage: []            # original: emptyDir /app/logs (1Gi) + /tmp — not needed for the demo
    secrets: []
    env:
      - name: JAVA_OPTS
        value: "-Xmx512m -Xms256m -Dlog4j.configurationFile=/app/log4j2.xml"
      - name: LOG4J_FORMAT_MSG_NO_LOOKUPS
        value: "false"       # VULNERABLE on purpose
      - name: LOG4J2_DISABLE_JNDI
        value: "false"       # VULNERABLE on purpose
      - name: SPRING_PROFILES_ACTIVE
        fromProperty: spring-profiles
    probes:
      httpGet:
        path: /health
        port: 8080
    security:              # as in the original deployment (needs _generic >= v3.2 for runAsUser/runAsGroup)
      runAsNonRoot: true
      runAsUser: 1000      # the image's default USER is root; forcing UID 1000 is what the original does
      runAsGroup: 1000
    outputs:
      fqdn:
        template: "${serviceFqdn}"
      http-port:
        value: 8080
      url:
        template: "http://${serviceFqdn}:8080"
    targets:
      openshift:
        expose: none
      k8s:
        expose: none

status:
  success:
    fqdn: {}
    http-port: {}
    url: {}
